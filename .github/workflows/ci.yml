name: CI
on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: inspections_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d inspections_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_DB_INTEGRATION: "1"
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/inspections_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend etl tests
      - run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
